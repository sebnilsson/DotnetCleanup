# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer package version, with or without v prefix.'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Resolve Package Version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        $rawVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_VERSION }
        $versionPattern = '^(?:v)?(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$'

        if ($env:GITHUB_REF_TYPE -eq 'tag' -and -not $rawVersion.StartsWith('v', [System.StringComparison]::Ordinal)) {
          throw "Publish tags must use v-prefixed SemVer, for example v1.2.3. Got '$rawVersion'."
        }

        if ($rawVersion -notmatch $versionPattern) {
          throw "Version '$rawVersion' is not valid SemVer. Use v1.2.3, v1.2.3-beta.1, or v1.2.3+build.5."
        }

        $packageVersion = $Matches['version']
        "PackageVersion=$packageVersion" >> $env:GITHUB_ENV
        "package-version=$packageVersion" >> $env:GITHUB_OUTPUT
        "Resolved package version: $packageVersion" >> $env:GITHUB_STEP_SUMMARY

    - name: .NET Build and Test
      uses: ./.github/actions/dotnet-build-test
      with:
        msbuild-properties: >
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:InformationalVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true

    - name: .NET Pack
      run: >
        dotnet pack src/DotnetCleanup/DotnetCleanup.csproj
        --no-restore
        --no-build
        --configuration Release
        --output ${{ env.NuGetDirectory }}
        -p:Version=$env:PackageVersion
        -p:PackageVersion=$env:PackageVersion
        -p:InformationalVersion=$env:PackageVersion
        -p:ContinuousIntegrationBuild=true

    - name: NuGet Push
      run: dotnet nuget push ${{ env.NuGetDirectory }}/*.nupkg --api-key ${{ secrets.NUGET_APIKEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
